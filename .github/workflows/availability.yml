name: Disponibilidad pública — Burbujas Nails
on:
  push:
    branches: [master]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bn-public-health
  cancel-in-progress: false
jobs:
  production-health:
    name: HTTPS, catálogo, SEO y recursos públicos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar disponibilidad del sitio publicado
        run: node tests/production-health.mjs
