name: Seguridad web estática
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar sintaxis y ausencia de administración insegura
        run: npm test
      - name: Comprobar paquete distribuible
        run: bash build.sh

  browser-smoke:
    name: UI real Chromium / Firefox / WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar herramientas de pruebas (solo CI)
        run: npm ci --ignore-scripts
      - name: Instalar motores de navegador
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verificar recorridos y tamaños de pantalla
        run: node tests/browser-smoke.mjs
